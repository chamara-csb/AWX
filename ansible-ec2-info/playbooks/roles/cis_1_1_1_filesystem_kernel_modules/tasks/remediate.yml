---

############################################
# Find existing modprobe configuration files
############################################

- name: Find existing modprobe configuration
  find:
    paths: /etc/modprobe.d
    patterns: "*.conf"
  register: modprobe_files


############################################
# Remove old blacklist entries
############################################

- name: Remove existing blacklist rules
  replace:
    path: "{{ item.0.path }}"
    regexp: "^blacklist {{ item.1 }}.*$"
    replace: ""
  loop: "{{ modprobe_files.files | product(cis_filesystem_modules) | list }}"
  ignore_errors: yes


############################################
# Remove old install rules
############################################

- name: Remove existing install rules
  replace:
    path: "{{ item.0.path }}"
    regexp: "^install {{ item.1 }}.*$"
    replace: ""
  loop: "{{ modprobe_files.files | product(cis_filesystem_modules) | list }}"
  ignore_errors: yes


############################################
# Create CIS configuration
############################################

- name: Create CIS filesystem module configuration
  copy:
    dest: "{{ cis_modprobe_config.path }}"
    owner: root
    group: root
    mode: '0644'
    content: |
      #
      # CIS Benchmark 1.1.1
      # Disable unused filesystem kernel modules
      #

      {% for module in cis_filesystem_modules %}
      blacklist {{ module }}
      install {{ module }} /bin/false

      {% endfor %}


############################################
# Check currently loaded modules
############################################

- name: Check loaded filesystem modules
  shell: |
    lsmod | grep -w "{{ item }}"
  register: loaded_modules
  failed_when: false
  changed_when: false
  loop: "{{ cis_filesystem_modules }}"


############################################
# Unload loaded modules
############################################

- name: Unload filesystem modules
  command: "modprobe -r {{ item.item }}"
  when:
    - item.stdout != ""
  loop: "{{ loaded_modules.results }}"


############################################
# Reload module dependency
############################################

- name: Run depmod
  command: depmod -a
