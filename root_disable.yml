---
- name: Disable Root SSH Access and Update SLES
  hosts: all
  become: true
  gather_facts: true

  tasks:

    - name: Display server information
      ansible.builtin.debug:
        msg:
          - "Hostname: {{ ansible_hostname }}"
          - "IP Address: {{ ansible_default_ipv4.address }}"
          - "Operating System: {{ ansible_distribution }} {{ ansible_distribution_version }}"

    - name: Check current SSH root login configuration
      ansible.builtin.command:
        cmd: sshd -T
      register: sshd_config
      changed_when: false

    - name: Disable SSH root login
      ansible.builtin.lineinfile:
        path: /etc/ssh/sshd_config
        regexp: '^[#[:space:]]*PermitRootLogin'
        line: 'PermitRootLogin no'
        backup: true
      notify: Restart SSH

    - name: Refresh Zypper repositories
      ansible.builtin.command:
        cmd: zypper --non-interactive refresh
      register: zypper_refresh
      changed_when: false

    - name: Update all installed packages
      ansible.builtin.command:
        cmd: zypper --non-interactive update
      register: zypper_update
      changed_when: false

    - name: Display Zypper update result
      ansible.builtin.debug:
        var: zypper_update.stdout_lines

  handlers:

    - name: Restart SSH
      ansible.builtin.service:
        name: sshd
        state: restarted
