    - name: Check SSM Agent service status
      ansible.builtin.command:
        cmd: "systemctl is-active amazon-ssm-agent"
      register: ssm_status
      changed_when: false

    - name: Display SSM Agent status
      ansible.builtin.debug:
        msg: "AWS SSM Agent status: {{ ssm_status.stdout }}"

    - name: Check installed SSM Agent package
      ansible.builtin.command:
        cmd: "rpm -qi amazon-ssm-agent"
      register: ssm_package
      changed_when: false

    - name: Display SSM Agent package information
      ansible.builtin.debug:
        var: ssm_package.stdout

    - name: Fail if SSM Agent is not running
      ansible.builtin.fail:
        msg: "SSM Agent is installed but the service is not running."
      when: ssm_status.stdout != "active"
