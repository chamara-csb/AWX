---
- name: Install AWS SSM Agent on SLES
  hosts: all
  become: true
  gather_facts: true

  vars:
    ssm_agent_rpm: "/tmp/amazon-ssm-agent.rpm"
    ssm_agent_url: "https://s3.eu-west-1.amazonaws.com/amazon-ssm-eu-west-1/latest/linux_amd64/amazon-ssm-agent.rpm"

  tasks:

    - name: Display server information
      ansible.builtin.debug:
        msg:
          - "Hostname: {{ ansible_hostname }}"
          - "OS: {{ ansible_distribution }}"
          - "OS Version: {{ ansible_distribution_version }}"
          - "Architecture: {{ ansible_architecture }}"

    - name: Check curl is installed
      ansible.builtin.command:
        cmd: "which curl"
      register: curl_check
      changed_when: false
      failed_when: false

    - name: Install curl if missing
      ansible.builtin.command:
        cmd: "zypper --non-interactive install curl"
      when: curl_check.rc != 0

    - name: Download AWS SSM Agent RPM
      ansible.builtin.command:
        cmd: >
          curl -L --fail --silent --show-error
          -o {{ ssm_agent_rpm }}
          "{{ ssm_agent_url }}"
      register: ssm_download
      changed_when: true

    - name: Verify SSM Agent RPM exists
      ansible.builtin.stat:
        path: "{{ ssm_agent_rpm }}"
      register: ssm_rpm_file

    - name: Fail if SSM Agent RPM was not downloaded
      ansible.builtin.fail:
        msg: "SSM Agent RPM download failed."
      when: not ssm_rpm_file.stat.exists

    - name: Check SSM Agent RPM
      ansible.builtin.command:
        cmd: "rpm -qip {{ ssm_agent_rpm }}"
      register: rpm_info
      changed_when: false

    - name: Display RPM information
      ansible.builtin.debug:
        var: rpm_info.stdout

    - name: Install AWS SSM Agent
      ansible.builtin.command:
        cmd: "rpm -Uvh {{ ssm_agent_rpm }}"
      register: rpm_install
      changed_when: true

    - name: Enable AWS SSM Agent
      ansible.builtin.command:
        cmd: "systemctl enable amazon-ssm-agent"
      changed_when: false

    - name: Start AWS SSM Agent
      ansible.builtin.command:
        cmd: "systemctl start amazon-ssm-agent"

    - name: Check AWS SSM Agent status
      ansible.builtin.command:
        cmd: "systemctl is-active amazon-ssm-agent"
      register: ssm_status
      changed_when: false

    - name: Display SSM Agent status
      ansible.builtin.debug:
        msg: "AWS SSM Agent status: {{ ssm_status.stdout }}"

    - name: Check SSM Agent version
      ansible.builtin.command:
        cmd: "/opt/aws/ssm/bin/amazon-ssm-agent -version"
      register: ssm_version
      changed_when: false

    - name: Display SSM Agent version
      ansible.builtin.debug:
        var: ssm_version.stdout

    - name: Fail if SSM Agent is not running
      ansible.builtin.fail:
        msg: "AWS SSM Agent installation completed, but the service is not running."
      when: ssm_status.stdout != "active"
