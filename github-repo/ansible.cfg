[defaults]

# Location of Ansible roles
roles_path = /runner/project/github-repo/roles

# Disable SSH host key checking for automation
host_key_checking = False

# Disable deprecation warnings
deprecation_warnings = False

# Output formatting
stdout_callback = yaml

# Retry files are not needed in AWX
retry_files_enabled = False

# Inventory timeout
timeout = 30


[ssh_connection]

# Improve SSH performance
pipelining = True
