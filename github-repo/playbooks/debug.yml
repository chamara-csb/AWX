---
- name: Check AWX project structure

  hosts: localhost

  gather_facts: false

  become: false


  tasks:

    - name: Show repository structure

      shell: |
        echo "Current directory:"
        pwd

        echo "Repository:"
        ls -la /runner/project/github-repo

        echo "Roles:"
        find /runner/project/github-repo -maxdepth 4 -type d | grep roles

      register: output


    - name: Display output

      debug:
        var: output.stdout_lines
